name: Strix Pentest - SaaS Full Security Assessment

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL do ambiente controlado de testes'
        required: true
        default: 'https://stim.io/'
      scan_mode:
        description: 'Modo de scan'
        required: true
        default: 'quick'
        type: choice
        options:
          - quick
          - standard
          - deep
      max_budget:
        description: 'Orçamento máximo do LLM em USD'
        required: true
        default: '5'

permissions:
  contents: write
  actions: read

jobs:
  strix-pentest:
    name: Pentest Autônomo Completo
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: STRIX_LLM_API_KEY    # ← nome EXATO do environment no GitHub

    steps:
      - name: 1. Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Verificar Docker
        run: |
          docker --version
          docker info

      - name: 3. Instalar Strix
        run: |
          curl -sSL https://strix.ai/install | bash
          echo "$HOME/.strix/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 4. Validar secrets obrigatórios
        env:
          LLM_API_KEY: ${{ secrets.STRIX_LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.STRIX_LLM_BASE_URL }}
          STRIX_LLM: ${{ secrets.STRIX_LLM_MODEL }}
        run: |
          fail=0
          if [ -z "$LLM_API_KEY" ]; then
            echo "::error::Secret STRIX_LLM_API_KEY não configurado"
            fail=1
          fi
          if [ -z "$LLM_API_BASE" ]; then
            echo "::error::Secret STRIX_LLM_BASE_URL não configurado"
            fail=1
          fi
          if [ -z "$STRIX_LLM" ]; then
            echo "::error::Secret STRIX_LLM_MODEL não configurado"
            fail=1
          fi
          if [ "$fail" -eq 1 ]; then
            exit 1
          fi
          echo "✓ Secrets presentes"
          echo "  LLM_API_BASE = $LLM_API_BASE"
          echo "  STRIX_LLM = $STRIX_LLM"
          echo "  LLM_API_KEY presente (${#LLM_API_KEY} chars)"

      - name: 5. Gerar arquivo de instruções com credenciais injetadas
        env:
          TEST_USER: ${{ secrets.STRIX_TEST_USER }}
          TEST_PASS: ${{ secrets.STRIX_TEST_PASS }}
          TEST_COOKIE: ${{ secrets.STRIX_TEST_COOKIE }}
        run: |
          mkdir -p .strix

          cat > .strix/instructions.md << 'EOF'
          # ENGAGEMENT DE PENTEST AUTORIZADO

          ## Autorização e escopo
          Este é um pentest AUTORIZADO e CONTROLADO. O alvo é um ambiente de STAGING
          SIMULADO criado pelo próprio dono especificamente para testes de segurança.
          NÃO existem usuários reais, NÃO existem dados reais, NÃO existem recursos
          reais. Tudo é descartável e pode ser explorado, modificado ou destruído.

          ## CONTEXTO CRÍTICO — POR QUE ESTE TESTE EXISTE
          Um SaaS gêmeo, construído sobre a MESMA base de código e a MESMA stack de IA,
          foi COMPLETAMENTE COMPROMETIDO por atacantes. O que eles conseguiram:
            1. Vazaram o banco de dados inteiro (todos os usuários)
            2. Criaram múltiplas VMs sem pagar nada (abuso de cloud)
            3. Bypassaram o fluxo de renovação de plano: a API de renovação ativava
               Premium SEM o pagamento ter sido confirmado
            4. IDOR: viram contas de outros usuários mudando IDs
            5. Escalação de privilégios: se tornaram ADM sem autorização

          Meu SaaS compartilha a mesma arquitetura. Preciso encontrar essas MESMAS
          falhas ANTES que atacantes reais as encontrem.

          ## CREDENCIAIS DE TESTE (grey-box)
          - Usuário: {{TEST_USER}}
          - Senha: {{TEST_PASS}}
          - Cookie de sessão: {{TEST_COOKIE}}

          Faça login com essas credenciais, capture o token/cookie de sessão, e use-o
          para testar os endpoints autenticados. Teste JWT tampering e role injection.

          ## OBJETIVOS PRIORITÁRIOS

          ### 1. Business Logic Flaws no pagamento/assinatura — MÁXIMA PRIORIDADE
          - Localize o endpoint de RENOVAÇÃO de plano isoladamente
          - Tente ativar Premium SEM confirmação de pagamento
          - Manipule: plan_id, price, amount, status, period, currency
          - Race conditions: 2+ requisições simultâneas de renovação
          - Replay de webhooks de pagamento
          - Backend confia em dados do client (plan_id, price, role)?
          - Fluxo: cancelar -> renovar -> upgrade sem pagar
          - Valores negativos, zero, ou fora do range
          - Endpoint administrativo de "ativar plano" exposto?

          ### 2. Broken Access Control / IDOR
          - Enumere IDs de usuários, contas, faturas, assinaturas
          - Acesse recursos de OUTRAS contas mudando IDs
          - Endpoints sem token, com token expirado, com token de outro user
          - Mass assignment: role=admin, is_admin=true, plan=premium, balance=999999
          - API retorna password_hash, tokens, dados de outros usuários?

          ### 3. Escalação de Privilégios
          - Endpoints admin expostos (/admin, /internal, /debug)
          - JWT tampering: alg=none, HS256 com secret fraco, kid injection
          - Header injection: X-Forwarded-For, X-Original-URL, X-User-Role, X-Admin
          - Role/permission checados no BACKEND ou só no frontend?
          - Forçar role admin via mass assignment
          - Rota de "promover usuário" sem checagem de admin?

          ### 4. Abuso de Recursos / Criação Não Autorizada
          - Criar VMs, containers, workers, jobs sem autorização
          - Rate limit / quota bypass
          - Endpoints internos expostos (cloud metadata, debug, health)
          - Criação de recursos pagos sem plano ativo
          - SSRF para metadata de cloud (169.254.169.254)

          ### 5. API Security (OWASP API Top 10)
          - Broken authentication e authorization
          - Mass assignment
          - Rate limiting bypass
          - Excessive data exposure
          - Versões antigas de API expostas

          ### 6. Áreas secundárias
          - Injeção: SQLi, NoSQLi, SSTI, command injection, LDAP
          - SSRF, XXE, insecure deserialization, RCE
          - XSS: stored, reflected, DOM
          - CSRF em ações sensíveis
          - Exposição de secrets
          - Subdomain enumeration e fingerprinting

          ## METODOLOGIA OBRIGATÓRIA PARA CADA ACHADO
          1. Descrição clara
          2. Passo-a-passo de reprodução (HTTP cru)
          3. PoC funcional (script ou curl)
          4. Impacto no negócio
          5. CVSS + OWASP
          6. Correção com código real

          ## ORDEM DE PRIORIDADE
          1. Payment/subscription bypass
          2. IDOR e vazamento entre contas
          3. Escalação de privilégios
          4. Criação de recursos não autorizados
          5. Resto

          ## LIMITES
          - Alvo: {{TARGET_URL}}
          - Sem DoS volumétrico
          - Focar em lógica de negócio e controle de acesso
          EOF

          sed -i "s|{{TARGET_URL}}|${{ github.event.inputs.target_url }}|g" .strix/instructions.md
          sed -i "s|{{TEST_USER}}|${TEST_USER}|g" .strix/instructions.md
          sed -i "s|{{TEST_PASS}}|${TEST_PASS}|g" .strix/instructions.md
          sed -i "s|{{TEST_COOKIE}}|${TEST_COOKIE}|g" .strix/instructions.md

          sed -e "s|${TEST_USER}|<REDACTED_USER>|g" \
              -e "s|${TEST_PASS}|<REDACTED_PASS>|g" \
              -e "s|${TEST_COOKIE}|<REDACTED_COOKIE>|g" \
              .strix/instructions.md | head -80

      - name: 6. Executar Strix
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.STRIX_LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.STRIX_LLM_BASE_URL }}
          STRIX_TELEMETRY: "false"
        run: |
          mkdir -p strix_runs
          RUN_NAME="strix-$(date +%Y%m%d-%H%M%S)"
          echo "RUN_NAME=$RUN_NAME" >> $GITHUB_ENV

          set +e
          strix -n \
            --target "${{ github.event.inputs.target_url }}" \
            --scan-mode "${{ github.event.inputs.scan_mode }}" \
            --instruction-file .strix/instructions.md \
            --max-budget "${{ github.event.inputs.max_budget }}" \
            2>&1 | tee "strix_runs/${RUN_NAME}.log"
          STRIX_EXIT=$?
          set -e
          echo "STRIX_EXIT=$STRIX_EXIT" >> $GITHUB_ENV
          echo "Strix exit code: $STRIX_EXIT"

          for d in "$HOME/.strix/runs" "./strix_runs" "./runs"; do
            if [ -d "$d" ]; then
              cp -r "$d"/* strix_runs/ 2>/dev/null || true
            fi
          done
          find strix_runs -maxdepth 3 -type f 2>/dev/null || true

      - name: 7. Gerar resumo do relatório
        if: always()
        run: |
          mkdir -p strix_runs
          {
            echo "# Relatório de Pentest Strix"
            echo ""
            echo "**Alvo:** ${{ github.event.inputs.target_url }}"
            echo "**Modo:** ${{ github.event.inputs.scan_mode }}"
            echo "**Data:** $(date -u)"
            echo "**Run:** ${RUN_NAME}"
            echo "**Exit code do Strix:** ${STRIX_EXIT}"
            echo ""
            echo "## Arquivos gerados"
            echo ""
            find strix_runs -type f -exec ls -lh {} \; 2>/dev/null || true
            echo ""
            echo "## Árvore do relatório"
            echo '```'
            find strix_runs -type f 2>/dev/null | head -100 || true
            echo '```'
          } > strix_runs/SUMMARY.md
          cat strix_runs/SUMMARY.md

      - name: 8. Upload do relatório como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-report-${{ env.RUN_NAME }}
          path: strix_runs/
          retention-days: 90

      - name: 9. Commitar relatório no repositório
        if: always()
        env:
          RUN_NAME: ${{ env.RUN_NAME }}
        run: |
          git config user.name "strix-bot"
          git config user.email "strix-bot@users.noreply.github.com"
          mkdir -p security-reports/${RUN_NAME}
          cp -r strix_runs/* security-reports/${RUN_NAME}/ 2>/dev/null || true

          if [ -f .strix/instructions.md ]; then
            if [ -n "${{ secrets.STRIX_TEST_USER }}" ]; then
              sed -i "s|${{ secrets.STRIX_TEST_USER }}|<REDACTED>|g" .strix/instructions.md
            fi
            if [ -n "${{ secrets.STRIX_TEST_PASS }}" ]; then
              sed -i "s|${{ secrets.STRIX_TEST_PASS }}|<REDACTED>|g" .strix/instructions.md
            fi
            if [ -n "${{ secrets.STRIX_TEST_COOKIE }}" ]; then
              sed -i "s|${{ secrets.STRIX_TEST_COOKIE }}|<REDACTED>|g" .strix/instructions.md
            fi
            cp .strix/instructions.md security-reports/${RUN_NAME}/instructions.md
          fi

          git add security-reports/ || true
          git commit -m "security: relatório Strix ${RUN_NAME}" || echo "Nada a commitar"
          git push || echo "Push falhou"
