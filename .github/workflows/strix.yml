name: Strix Pentest - SaaS Full Security Assessment

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL do SEU ambiente de teste (somente domínios que você controla)'
        required: true
        default: 'https://stim.io/'
      authorized_domain:
        description: 'Domínio raiz que você é DONO (trava de segurança, ex: stim.io)'
        required: true
        default: 'stim.io'
      scan_mode:
        description: 'Modo de scan'
        required: true
        default: 'quick'
        type: choice
        options:
          - quick
          - standard
          - deep
      max_budget:
        description: 'Orçamento máximo do LLM em USD'
        required: true
        default: '5'

permissions:
  contents: write
  actions: read

jobs:
  strix-pentest:
    name: Pentest Autônomo Completo
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: STRIX_LLM_API_KEY

    steps:
      - name: 0. TRAVA DE SEGURANÇA - validar que o alvo é autorizado
        run: |
          TARGET="${{ github.event.inputs.target_url }}"
          AUTHORIZED="${{ github.event.inputs.authorized_domain }}"
          echo "Alvo: $TARGET"
          echo "Domínio autorizado: $AUTHORIZED"
          if [[ "$TARGET" != *"$AUTHORIZED"* ]]; then
            echo "::error::BLOQUEADO. O alvo '$TARGET' NÃO contém o domínio autorizado '$AUTHORIZED'."
            echo "::error::Pentest sem autorização escrita é crime. Se você é dono do alvo, ajuste 'authorized_domain'."
            exit 1
          fi
          echo "✓ Alvo dentro do domínio autorizado"

      - name: 1. Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Verificar Docker
        run: |
          docker --version
          docker info

      - name: 3. Instalar Strix
        run: |
          curl -sSL https://strix.ai/install | bash
          echo "$HOME/.strix/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 4. Validar secrets obrigatórios
        env:
          LLM_API_KEY: ${{ secrets.STRIX_LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.STRIX_LLM_BASE_URL }}
          STRIX_LLM: ${{ secrets.STRIX_LLM_MODEL }}
        run: |
          fail=0
          [ -z "$LLM_API_KEY" ] && echo "::error::STRIX_LLM_API_KEY vazio" && fail=1
          [ -z "$LLM_API_BASE" ] && echo "::error::STRIX_LLM_BASE_URL vazio" && fail=1
          [ -z "$STRIX_LLM" ] && echo "::error::STRIX_LLM_MODEL vazio" && fail=1
          [ "$fail" -eq 1 ] && exit 1
          echo "✓ Secrets presentes"
          echo "  LLM_API_BASE = $LLM_API_BASE"
          echo "  STRIX_LLM = $STRIX_LLM"

      - name: 5. Gerar instructions.md (sem imprimir credenciais)
        env:
          TEST_USER: ${{ secrets.STRIX_TEST_USER }}
          TEST_PASS: ${{ secrets.STRIX_TEST_PASS }}
          TEST_COOKIE: ${{ secrets.STRIX_TEST_COOKIE }}
        run: |
          mkdir -p .strix

          # Escreve o template em arquivo separado, com placeholders ${VAR}
          cat > .strix/template.md << 'TEMPLATE_EOF'
          # ENGAGEMENT DE PENTEST AUTORIZADO

          ## Autorização e escopo
          Pentest AUTORIZADO e CONTROLADO. Alvo é ambiente de STAGING SIMULADO do
          próprio dono. NÃO existem usuários reais nem dados reais. Tudo é descartável.

          ## CONTEXTO — POR QUE ESTE TESTE EXISTE
          Um SaaS gêmeo, mesma base de código e mesma stack de IA, foi comprometido:
            1. Vazamento do banco de dados inteiro
            2. Criação de múltiplas VMs sem pagamento
            3. Bypass do fluxo de renovação de plano (ativava Premium sem pagamento)
            4. IDOR entre contas
            5. Escalação para ADM sem autorização

          Preciso encontrar essas MESMAS falhas antes de atacantes reais.

          ## CREDENCIAIS DE TESTE (grey-box)
          - Usuário: ${TEST_USER}
          - Senha: ${TEST_PASS}
          - Cookie: ${TEST_COOKIE}

          Faça login, capture sessão, teste endpoints autenticados, JWT tampering,
          role injection.

          ## OBJETIVOS PRIORITÁRIOS

          ### 1. Business Logic Flaws no pagamento/assinatura — MÁXIMA PRIORIDADE
          - Endpoint de RENOVAÇÃO de plano isoladamente
          - Ativar Premium SEM confirmação de pagamento
          - Manipular: plan_id, price, amount, status, period, currency
          - Race conditions: 2+ requisições simultâneas
          - Replay de webhooks
          - Backend confia em dados do client?
          - Cancelar -> renovar -> upgrade sem pagar
          - Valores negativos, zero, fora do range
          - Endpoint admin de "ativar plano" exposto?

          ### 2. Broken Access Control / IDOR
          - Enumerar IDs de usuários, contas, faturas
          - Acessar recursos de OUTRAS contas mudando IDs
          - Endpoints sem token, com token expirado, de outro user
          - Mass assignment: role=admin, is_admin=true, plan=premium
          - API retorna password_hash, tokens, PII?

          ### 3. Escalação de Privilégios
          - /admin, /internal, /debug expostos
          - JWT: alg=none, HS256 secret fraco, kid injection
          - Header: X-Forwarded-For, X-Original-URL, X-User-Role, X-Admin
          - Role checado no BACKEND ou só no frontend?
          - Forçar admin via mass assignment
          - Rota de promover usuário sem checagem?

          ### 4. Abuso de Recursos
          - Criar VMs, containers, workers, jobs sem autorização
          - Rate limit / quota bypass
          - Endpoints internos expostos
          - Criar recursos pagos sem plano ativo
          - SSRF para 169.254.169.254

          ### 5. API Security (OWASP API Top 10)
          - Broken auth, mass assignment, rate limiting, excessive data exposure

          ### 6. Secundárias
          - SQLi, NoSQLi, SSTI, command injection, LDAP
          - SSRF, XXE, deserialization, RCE
          - XSS stored/reflected/DOM
          - CSRF em ações sensíveis
          - Exposição de secrets
          - Subdomain enum e fingerprinting

          ## METODOLOGIA POR ACHADO
          1. Descrição
          2. Passo-a-passo (HTTP cru)
          3. PoC funcional
          4. Impacto no negócio
          5. CVSS + OWASP
          6. Correção com código

          ## ORDEM DE PRIORIDADE
          1. Payment bypass
          2. IDOR
          3. Privesc
          4. Recursos não autorizados
          5. Resto

          ## LIMITES
          - Alvo: ${TARGET_URL}
          - Sem DoS volumétrico
          - Focar em lógica de negócio e controle de acesso
          TEMPLATE_EOF

          # Substitui de forma segura com envsubst
          export TARGET_URL="${{ github.event.inputs.target_url }}"
          envsubst < .strix/template.md > .strix/instructions.md
          rm .strix/template.md

          # Confirma que gerou sem imprimir conteúdo sensível
          echo "instructions.md gerado com $(wc -l < .strix/instructions.md) linhas"
          echo "Credenciais injetadas: user=${TEST_USER:+sim}, pass=${TEST_PASS:+sim}, cookie=${TEST_COOKIE:+sim}"

      - name: 6. Executar Strix
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.STRIX_LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.STRIX_LLM_BASE_URL }}
          STRIX_TELEMETRY: "false"
        run: |
          mkdir -p strix_runs
          RUN_NAME="strix-$(date +%Y%m%d-%H%M%S)"
          echo "RUN_NAME=$RUN_NAME" >> $GITHUB_ENV

          set +e
          strix -n \
            --target "${{ github.event.inputs.target_url }}" \
            --scan-mode "${{ github.event.inputs.scan_mode }}" \
            --instruction-file .strix/instructions.md \
            --max-budget "${{ github.event.inputs.max_budget }}" \
            2>&1 | tee "strix_runs/${RUN_NAME}.log"
          STRIX_EXIT=$?
          set -e
          echo "STRIX_EXIT=$STRIX_EXIT" >> $GITHUB_ENV
          echo "Strix exit code: $STRIX_EXIT"

          for d in "$HOME/.strix/runs" "./strix_runs" "./runs"; do
            if [ -d "$d" ]; then
              cp -r "$d"/* strix_runs/ 2>/dev/null || true
            fi
          done

      - name: 7. Gerar resumo do relatório
        if: always()
        run: |
          mkdir -p strix_runs
          {
            echo "# Relatório de Pentest Strix"
            echo ""
            echo "**Alvo:** ${{ github.event.inputs.target_url }}"
            echo "**Modo:** ${{ github.event.inputs.scan_mode }}"
            echo "**Data:** $(date -u)"
            echo "**Run:** ${RUN_NAME}"
            echo "**Exit code do Strix:** ${STRIX_EXIT}"
            echo ""
            echo "## Arquivos gerados"
            find strix_runs -type f -exec ls -lh {} \; 2>/dev/null || true
          } > strix_runs/SUMMARY.md
          cat strix_runs/SUMMARY.md

      - name: 8. Upload do relatório como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-report-${{ env.RUN_NAME }}
          path: strix_runs/
          retention-days: 90

      - name: 9. Commitar relatório no repositório
        if: always()
        env:
          RUN_NAME: ${{ env.RUN_NAME }}
        run: |
          git config user.name "strix-bot"
          git config user.email "strix-bot@users.noreply.github.com"
          mkdir -p security-reports/${RUN_NAME}
          cp -r strix_runs/* security-reports/${RUN_NAME}/ 2>/dev/null || true

          git add security-reports/ || true
          git commit -m "security: relatório Strix ${RUN_NAME}" || echo "Nada a commitar"
          git push || echo "Push falhou"
