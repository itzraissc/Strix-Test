name: Strix Pentest - SaaS Full Security Assessment

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL do ambiente controlado de testes'
        required: true
        default: 'https://stim.io/'
      scan_mode:
        description: 'Modo de scan'
        required: true
        default: 'quick'
        type: choice
        options:
          - quick
          - standard
          - deep
      max_budget:
        description: 'Orçamento máximo do LLM em USD'
        required: true
        default: '5'

permissions:
  contents: write
  actions: read

jobs:
  strix-pentest:
    name: Pentest Autônomo Completo
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Verificar Docker
        run: |
          docker --version
          docker info

      - name: 3. Instalar Strix
        run: |
          curl -sSL https://strix.ai/install | bash
          echo "$HOME/.strix/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 4. Validar secrets obrigatórios
        env:
          LLM_API_KEY: ${{ secrets.STRIX_LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.STRIX_LLM_BASE_URL }}
          STRIX_LLM: ${{ secrets.STRIX_LLM_MODEL }}
        run: |
          fail=0
          if [ -z "$LLM_API_KEY" ]; then
            echo "::error::Secret STRIX_LLM_API_KEY não configurado"
            fail=1
          fi
          if [ -z "$LLM_API_BASE" ]; then
            echo "::error::Secret STRIX_LLM_BASE_URL não configurado"
            fail=1
          fi
          if [ -z "$STRIX_LLM" ]; then
            echo "::error::Secret STRIX_LLM_MODEL não configurado"
            fail=1
          fi
          if [ "$fail" -eq 1 ]; then
            exit 1
          fi
          echo "✓ Secrets presentes"
          echo "  LLM_API_BASE configurado: $LLM_API_BASE"
          echo "  STRIX_LLM configurado: $STRIX_LLM"
          echo "  LLM_API_KEY presente (${#LLM_API_KEY} chars)"

      - name: 5. Gerar arquivo de instruções com credenciais injetadas
        env:
          TEST_USER: ${{ secrets.STRIX_TEST_USER }}
          TEST_PASS: ${{ secrets.STRIX_TEST_PASS }}
          TEST_COOKIE: ${{ secrets.STRIX_TEST_COOKIE }}
        run: |
          mkdir -p .strix

          cat > .strix/instructions.md << 'EOF'
          # ENGAGEMENT DE PENTEST AUTORIZADO

          ## Autorização e escopo
          Este é um pentest AUTORIZADO e CONTROLADO. O alvo é um ambiente de STAGING
          SIMULADO criado pelo próprio dono especificamente para testes de segurança.
          NÃO existem usuários reais, NÃO existem dados reais, NÃO existem recursos
          reais. Tudo é descartável e pode ser explorado, modificado ou destruído.
          Tenho autorização escrita e verbal para testar todos os endpoints, fluxos,
          APIs e lógica de negócio deste alvo.

          ## CONTEXTO CRÍTICO — POR QUE ESTE TESTE EXISTE
          Um SaaS gêmeo, construído sobre a MESMA base de código e a MESMA stack de IA,
          foi COMPLETAMENTE COMPROMETIDO por atacantes. O que eles conseguiram:
            1. Vazaram o banco de dados inteiro (todos os usuários)
            2. Criaram múltiplas VMs sem pagar nada (abuso de cloud)
            3. Bypassaram o fluxo de renovação de plano: a API de renovação ativava
               Premium SEM o pagamento ter sido confirmado. A brecha estava em um
               endpoint de renovação que aceitava ativar o plano sem validar pagamento.
            4. IDOR: viram contas de outros usuários mudando IDs
            5. Escalação de privilégios: se tornaram ADM sem autorização

          Meu SaaS compartilha a mesma arquitetura. Preciso encontrar essas MESMAS
          falhas ANTES que atacantes reais as encontrem.

          ## CREDENCIAIS DE TESTE (grey-box)
          Use estas credenciais para autenticar e testar a área logada:
          - Usuário: {{TEST_USER}}
          - Senha: {{TEST_PASS}}
          - Cookie de sessão (se aplicável): {{TEST_COOKIE}}

          Fluxo sugerido: faça login com essas credenciais, capture o token/cookie de
          sessão, e use-o para testar os endpoints autenticados. Teste também o que
          acontece quando você MANIPULA o token (JWT tampering, role injection, etc).

          ## OBJETIVOS PRIORITÁRIOS (foco máximo)

          ### 1. Business Logic Flaws no pagamento/assinatura — MÁXIMA PRIORIDADE
          - Localize o endpoint de RENOVAÇÃO de plano isoladamente
          - Tente ativar Premium/plano pago SEM confirmação de pagamento
          - Manipule parâmetros: plan_id, price, amount, status, period, currency
          - Teste race conditions: dispare 2+ requisições simultâneas de renovação
          - Teste replay de webhooks de pagamento (reenvie o mesmo payload)
          - Verifique se o backend confia em dados do client (plan_id, price, role)
          - Teste fluxo: cancelar -> renovar -> upgrade sem pagar
          - Teste downgrade/upgrade com valores negativos, zero, ou fora do range
          - Verifique se há endpoint administrativo de "ativar plano" exposto

          ### 2. Broken Access Control / IDOR
          - Enumere IDs de usuários, contas, faturas, assinaturas, sessões
          - Tente acessar recursos de OUTRAS contas mudando IDs (incrementais, UUIDs)
          - Teste endpoints de API sem token, com token expirado, com token de outro user
          - Teste mass assignment: injete role=admin, is_admin=true, plan=premium,
            balance=999999, verified=true em payloads de update de perfil
          - Verifique se a API retorna mais campos do que deveria (password_hash,
            tokens, dados de outros usuários, PII)
          - Teste acesso direto a objetos referenciados por ID em TODOS os recursos

          ### 3. Escalação de Privilégios
          - Procure endpoints administrativos expostos (/admin, /internal, /debug)
          - Tente JWT tampering: alg=none, HS256 com secret fraco, kid injection
          - Teste header injection: X-Forwarded-For, X-Original-URL, X-User-Role,
            X-Admin, X-Forwarded-Host
          - Verifique se role/permission são checados no BACKEND ou só no frontend
          - Tente forçar role admin via mass assignment no cadastro/update
          - Verifique se há rota de "promover usuário" sem checagem de admin

          ### 4. Abuso de Recursos / Criação Não Autorizada
          - Tente criar VMs, containers, workers, jobs, filas sem autorização
          - Teste limites de rate limit e quota (bypass via headers, IP spoofing)
          - Verifique se há endpoints internos expostos (cloud metadata, debug, health)
          - Teste criação de recursos pagos sem plano ativo
          - Verifique se há SSRF para metadata de cloud (169.254.169.254)

          ### 5. API Security (OWASP API Top 10)
          - Broken authentication e authorization
          - Mass assignment
          - Rate limiting bypass
          - Excessive data exposure
          - Improper assets management (versões antigas de API expostas)

          ### 6. Áreas secundárias
          - Injeção: SQLi, NoSQLi, SSTI, command injection, LDAP
          - SSRF, XXE, insecure deserialization, RCE
          - XSS: stored, reflected, DOM
          - CSRF em ações sensíveis (renovação, troca de senha, admin)
          - Exposição de secrets (.env, configs, variáveis de ambiente, git history)
          - Subdomain enumeration e fingerprinting

          ## METODOLOGIA OBRIGATÓRIA PARA CADA ACHADO
          1. Descrição clara do que é e onde está
          2. Passo-a-passo de reprodução (comandos exatos, requisições HTTP cruas)
          3. PoC funcional (script Python ou curl que reproduz o exploit)
          4. Impacto real no negócio (o que um atacante consegue fazer)
          5. CVSS score + classificação OWASP
          6. Correção concreta com código (não teoria — snippet real)

          ## ORDEM DE PRIORIDADE
          1. Payment/subscription bypass (o que matou o SaaS do meu amigo)
          2. IDOR e vazamento de dados entre contas
          3. Escalação de privilégios (admin)
          4. Criação de recursos não autorizados (VMs)
          5. Resto

          ## LIMITES
          - Alvo: {{TARGET_URL}}
          - Não fazer DoS volumétrico (o ambiente é limitado)
          - Não exfiltrar dados reais (não existem, mas mantenha o escopo)
          - Focar em lógica de negócio e controle de acesso
          EOF

          sed -i "s|{{TARGET_URL}}|${{ github.event.inputs.target_url }}|g" .strix/instructions.md
          sed -i "s|{{TEST_USER}}|${TEST_USER}|g" .strix/instructions.md
          sed -i "s|{{TEST_PASS}}|${TEST_PASS}|g" .strix/instructions.md
          sed -i "s|{{TEST_COOKIE}}|${TEST_COOKIE}|g" .strix/instructions.md

          # Sanitiza antes de imprimir no log
          sed -e "s|${TEST_USER}|<REDACTED_USER>|g" \
              -e "s|${TEST_PASS}|<REDACTED_PASS>|g" \
              -e "s|${TEST_COOKIE}|<REDACTED_COOKIE>|g" \
              .strix/instructions.md | head -80

      - name: 6. Executar Strix
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.STRIX_LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.STRIX_LLM_BASE_URL }}
          STRIX_TELEMETRY: "false"
        run: |
          mkdir -p strix_runs
          RUN_NAME="strix-$(date +%Y%m%d-%H%M%S)"
          echo "RUN_NAME=$RUN_NAME" >> $GITHUB_ENV

          # Strix NÃO aceita --run-name. Ele gera o nome internamente.
          set +e
          strix -n \
            --target "${{ github.event.inputs.target_url }}" \
            --scan-mode "${{ github.event.inputs.scan_mode }}" \
            --instruction-file .strix/instructions.md \
            --max-budget "${{ github.event.inputs.max_budget }}" \
            2>&1 | tee "strix_runs/${RUN_NAME}.log"
          STRIX_EXIT=$?
          set -e
          echo "Strix exit code: $STRIX_EXIT"
          echo "STRIX_EXIT=$STRIX_EXIT" >> $GITHUB_ENV

          # Captura os diretórios de run gerados pelo Strix em locais conhecidos
          for d in "$HOME/.strix/runs" "./strix_runs" "./runs" "$HOME/.strix"; do
            if [ -d "$d" ]; then
              echo "Encontrado: $d"
              cp -r "$d"/* strix_runs/ 2>/dev/null || true
            fi
          done
          find strix_runs -maxdepth 3 -type f 2>/dev/null || true

      - name: 7. Gerar resumo do relatório
        if: always()
        run: |
          {
            echo "# Relatório de Pentest Strix"
            echo ""
            echo "**Alvo:** ${{ github.event.inputs.target_url }}"
            echo "**Modo:** ${{ github.event.inputs.scan_mode }}"
            echo "**Data:** $(date -u)"
            echo "**Run:** ${{ env.RUN_NAME }}"
            echo "**Exit code do Strix:** ${{ env.STRIX_EXIT }}"
            echo ""
            echo "## Arquivos gerados"
            echo ""
            find strix_runs -type f -exec ls -lh {} \; 2>/dev/null || true
            echo ""
            echo "## Árvore do relatório"
            echo '```'
            find strix_runs -type f 2>/dev/null | head -100 || true
            echo '```'
          } > strix_runs/SUMMARY.md
          cat strix_runs/SUMMARY.md

      - name: 8. Upload do relatório como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-report-${{ env.RUN_NAME }}
          path: strix_runs/
          retention-days: 90

      - name: 9. Commitar relatório no repositório
        if: always()
        env:
          RUN_NAME: ${{ env.RUN_NAME }}
        run: |
          git config user.name "strix-bot"
          git config user.email "strix-bot@users.noreply.github.com"
          mkdir -p security-reports/${RUN_NAME}
          cp -r strix_runs/* security-reports/${RUN_NAME}/ 2>/dev/null || true

          if [ -f .strix/instructions.md ]; then
            sed -i -e "s|${{ secrets.STRIX_TEST_USER }}|<REDACTED>|g" \
                   -e "s|${{ secrets.STRIX_TEST_PASS }}|<REDACTED>|g" \
                   -e "s|${{ secrets.STRIX_TEST_COOKIE }}|<REDACTED>|g" \
                   .strix/instructions.md
            cp .strix/instructions.md security-reports/${RUN_NAME}/instructions.md
          fi

          git add security-reports/ || true
          git commit -m "security: relatório Strix ${RUN_NAME}" || echo "Nada a commitar"
          git push || echo "Push falhou"
