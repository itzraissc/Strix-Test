name: Strix Security Scan

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL do ambiente de teste/staging do seu SaaS'
        required: true
        default: 'https://stim.io/'

jobs:
  strix-scan:
    name: Executar Varredura com Strix
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar ambiente Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Instalar o Strix Agent
        run: |
          python -m pip install --upgrade pip
          pipx install strix-agent

      - name: 4. Executar Varredura
        env:
          STRIX_LLM_API_KEY: ${{ secrets.STRIX_LLM_API_KEY }}
          STRIX_LLM_BASE_URL: "https://integrate.api.nvidia.com/v1"
          STRIX_LLM_MODEL: "openai/nvidia/nemotron-3-ultra-550b-a55b"
          OPENAI_API_KEY: ${{ secrets.STRIX_LLM_API_KEY }}
          OPENAI_BASE_URL: "https://integrate.api.nvidia.com/v1"
        run: |
          strix -n --target "${{ github.event.inputs.target_url }}"

      - name: 5. Salvar Relatório de Segurança como Artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-strix-saas
          path: strix_runs/
          
